server:
  port: 8095

spring:
  application:
    name: dsh-java-cron
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: non_null

dsh:
  cronforge:
    data-directory: ${user.home}/.dsh-java-cron
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}

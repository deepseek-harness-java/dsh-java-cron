<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH Cron Forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">CF</div>
      <div><strong>Cron Forge</strong><span>Powered by Harness</span></div>
    </div>
    <button class="primary block" id="newConversation">＋ 新对话</button>
    <div class="section-label"><span>对话记录</span></div>
    <div id="conversationList" class="item-list conversation-list"></div>
  </aside>

  <main class="main">
    <header class="main-header">
      <div>
        <div class="title-row">
          <span id="statusDot" class="dot ok"></span>
          <h1 id="currentName">定时任务工坊</h1>
        </div>
        <p id="currentDetail">解析表达式、算触发时间、揪重复任务 · 不写 crontab</p>
      </div>
      <div class="header-actions">
        <button class="ghost" id="registerJob">＋ 登记任务</button>
        <button class="ghost icon-btn" id="toggleTheme" title="切换主题">🌙</button>
      </div>
    </header>

    <div id="workspace" class="workspace">
      <section class="center">
        <div id="chatMessages" class="chat-scroll"></div>
        <div class="composer-wrap">
          <div id="streamStatus" class="stream-status hidden">
            <span id="streamStatusText"><span class="status-spinner"></span>AI 正在思考</span>
          </div>
          <div class="composer">
            <textarea id="chatInput" rows="1" placeholder="例如：0 9 * * 1-5 是什么意思？下次什么时候跑？"></textarea>
            <div class="composer-bar">
              <span class="composer-hint"><kbd>⌘</kbd>+<kbd>↵</kbd> 发送 · 只解析不执行</span>
              <div class="composer-actions">
                <button class="ghost small hidden" id="stopStream">停止</button>
                <button class="send-btn" id="sendMessage" title="发送">↑</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="resource-sidebar">
        <div class="resource-scroll">
          <div class="resource-header">
            <b>任务清单</b>
            <button class="ghost small" id="refreshResource">刷新</button>
          </div>
          <nav class="resource-tabs">
            <button data-resource-tab="parse" class="active">解析</button>
            <button data-resource-tab="jobs">任务</button>
            <button data-resource-tab="suggest">去重</button>
            <button data-resource-tab="library">节奏库</button>
          </nav>
          <section class="panel" data-tab="parse">
            <div class="panel-title"><span>表达式解析</span></div>
            <div class="panel-body" style="padding:8px">
              <div style="display:flex;gap:6px;margin-bottom:8px">
                <input id="exprInput" placeholder="*/5 * * * *" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-family:monospace">
                <button class="ghost small" id="parseBtn">解析</button>
              </div>
              <div id="parseCard" class="muted">输入表达式解析 + 算下次触发</div>
            </div>
          </section>
          <section class="panel hidden" data-tab="jobs">
            <div class="panel-title"><span>已登记任务</span></div>
            <div id="jobsCard" class="panel-body muted">点击"刷新"</div>
          </section>
          <section class="panel hidden" data-tab="suggest">
            <div class="panel-title"><span>去重建议</span></div>
            <div id="suggestCard" class="panel-body muted">点击"刷新"</div>
          </section>
          <section class="panel hidden" data-tab="library">
            <div class="panel-title"><span>常用节奏库</span></div>
            <div id="libraryCard" class="panel-body muted">点击"刷新"</div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <div class="modal hidden" id="jobModal">
    <form class="modal-card" id="jobForm" style="width:520px">
      <h2>登记定时任务</h2>
      <label>任务名<input name="name" required placeholder="order-sync"></label>
      <label>cron 表达式<input name="expr" required placeholder="0 */2 * * *" style="font-family:monospace"></label>
      <label>负责人<input name="owner" placeholder="张三"></label>
      <label>说明<input name="description" placeholder="订单同步，每 2 小时"></label>
      <p class="muted small">只登记到工坊清单用于去重分析，不写系统 crontab。</p>
      <div class="modal-actions"><button type="button" class="ghost" id="cancelModal">取消</button><button class="primary">登记</button></div>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
